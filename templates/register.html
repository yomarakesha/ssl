<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Manager — Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.25rem 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.35);
        }

        .auth-logo i {
            font-size: 1.75rem;
            color: white;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            padding: 0.55rem 0.9rem;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00b4d8;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary-grad {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            padding: 0.65rem;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        }

        .btn-primary-grad:hover {
            transform: translateY(-1px);
            color: #fff;
        }

        .auth-foot {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 1.25rem;
        }

        .auth-foot a {
            color: #00b4d8;
            text-decoration: none;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-building-add"></i></div>
        <h1 class="auth-title">Создать организацию</h1>
        <p class="auth-subtitle">Вы станете администратором новой организации</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Название организации</label>
                <input type="text" class="form-control" name="org_name"
                       value="{{ form.org_name or '' }}" placeholder="Моя студия" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" name="username"
                       value="{{ form.username or '' }}" placeholder="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email (необязательно)</label>
                <input type="email" class="form-control" name="email"
                       value="{{ form.email or '' }}" placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (минимум 8 символов)</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary-grad">
                <i class="bi bi-check2-circle me-2"></i>Создать
            </button>
        </form>

        <div class="auth-foot">
            Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a>
        </div>
    </div>
</body>

</html>

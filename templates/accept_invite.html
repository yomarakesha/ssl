<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>IT Manager — Принять инвайт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.25rem 2.5rem;
            width: 100%;
            max-width: 460px;
            color: #fff;
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        .auth-logo i {
            font-size: 1.75rem;
            color: white;
        }

        .auth-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00b4d8;
            color: #fff;
        }

        .btn-primary-grad {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            padding: 0.65rem;
            width: 100%;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-envelope-check"></i></div>
        <h1 class="auth-title">Присоединиться к {{ invite.organization.name }}</h1>
        <p class="auth-subtitle">Роль: {{ 'администратор' if invite.role == 'admin' else 'участник' }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" name="username"
                       value="{{ form.username or '' }}" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email"
                       value="{{ form.email or '' }}" {% if invite.email %}readonly{% endif %}>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (минимум 8 символов)</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary-grad">
                <i class="bi bi-check2-circle me-2"></i>Присоединиться
            </button>
        </form>
    </div>
</body>

</html>
